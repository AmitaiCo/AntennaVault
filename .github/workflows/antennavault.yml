name: AntennaVault APK

on:
  push:
    branches: [ guardian-gate ]
  workflow_dispatch:
    inputs:
      test_class:
        description: "Only run these instrumented test classes (comma separated, optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build FreeDebug APK"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Install stable debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build
        run: ./gradlew :app:assembleFreeDebug
      - uses: actions/upload-artifact@v4
        with:
          name: antennavault-free-debug
          path: app/build/outputs/apk/free/debug/app-free-debug.apk

  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Test
        run: ./gradlew testFreeDebugUnitTest testDebugUnitTest

  static-analysis:
    name: "Checkstyle and lint"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Checkstyle and lint
        run: ./gradlew checkstyle lint
      - name: Readable lint errors
        if: failure()
        run: python .github/workflows/errorPrinter.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.*'

  emulator-test:
    name: "Emulator tests API ${{ matrix.api-level }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
          - api-level: 36
            target: aosp_atd
    steps:
      - name: Remove unused packages to save space
        run: sudo apt-get remove firefox google-chrome-stable microsoft-edge-stable snapd powershell azure-cli llvm-16 llvm-17 llvm-18 llvm-16-dev llvm-17-dev llvm-18-dev || true
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Build test APKs
        run: ./gradlew assembleFreeDebugAndroidTest
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: TEST_CLASS="${{ github.event.inputs.test_class }}" bash .github/workflows/runAntennaVaultEmulatorTests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-test-report-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            **/build/outputs/androidTest-results/
